name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    # Weekly, so a dependency or toolchain change surfaces as a red build rather
    # than as a surprise in someone's pull request.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  test:
    name: test ${{ matrix.os }} go${{ matrix.go }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.23', 'stable']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          check-latest: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test with the race detector
        run: go test -race -short -count=1 ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: gofmt
        run: |
          files=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$files" ]; then
            echo "these files are not gofmt-ed:"
            echo "$files"
            exit 1
          fi

      - name: go mod tidy
        run: |
          go mod tidy
          if ! git diff --quiet -- go.mod go.sum; then
            echo "go.mod or go.sum is not tidy"
            git --no-pager diff -- go.mod go.sum
            exit 1
          fi

      # Pinned to the same version as the Makefile, so a local `make lint` and CI
      # cannot disagree about what "clean" means.
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v2.13.2

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
          staticcheck ./...

  # The live tests only run where a key is available. Forks do not receive
  # secrets, so this job is skipped rather than failed on a pull request from a
  # fork; the offline suite is what gates a merge.
  integration:
    name: integration (live)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Check for a key
        id: key
        run: |
          if [ -n "${{ secrets.TYPESAFE_API_KEY }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "TYPESAFE_API_KEY is not configured; skipping the live tests."
          fi

      - name: Live tests
        if: steps.key.outputs.present == 'true'
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          TYPESAFE_BASE_URL: ${{ vars.TYPESAFE_BASE_URL }}
          TYPESAFE_DEFAULT_MODEL: ${{ vars.TYPESAFE_DEFAULT_MODEL }}
        run: go test -run Integration -count=1 -v ./systemone/

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Cover
        run: go test -short -count=1 -coverprofile=coverage.out -covermode=atomic ./...

      - name: Report
        run: go tool cover -func=coverage.out | tail -1

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 7
