# Let an existing reverse-proxy container reach gateway:8081 over its Docker network.
# Only the admin console remains published on the host loopback address.
services:
  gateway:
    ports: !override
      - "${ADMIN_BIND_IP:-127.0.0.1}:${ADMIN_PORT:-8080}:8080"
    networks:
      default: {}
      proxy: {}

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:?set PROXY_NETWORK to the reverse proxy Docker network name}
